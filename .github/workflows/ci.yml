name: Platform CI
on: [push, pull_request]
jobs:
  reality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute Reality Gates
        run: python tests/reality_check_harness.py
